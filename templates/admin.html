<!-- admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Admin Panel</h1>
        <h2>Add Category</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Category Name</label>
                <input type="text" name="category_name" class="form-control" required>
            </div>
            <button type="submit" name="add_category" class="btn btn-success">Add Category</button>
        </form>
        <h2 class="mt-5">Add Menu Item</h2>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Name (English)</label>
                <input type="text" name="name_en" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Name (Arabic)</label>
                <input type="text" name="name_ar" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description (English)</label>
                <textarea name="description" class="form-control" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Description (Arabic)</label>
                <textarea name="description_ar" class="form-control" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="text" name="price" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-control" required>
                    {% for key, category in categories.items() %}
                    <option value="{{ category.name }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Image</label>
                <input type="file" name="image" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Add Item</button>
        </form>
        <h2 class="mt-5">Menu Items</h2>
        <ul class="list-group">
            {% for key, item in menu_items.items() %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ item.name_en }} / {{ item.name_ar }} - {{ item.category }} - {{ item.price }}
                <div>
                    <a href="{{ url_for('edit_item', item_id=key) }}" class="btn btn-warning">Edit</a>
                    <a href="{{ url_for('delete_item', item_id=key) }}" class="btn btn-danger">Delete</a>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
