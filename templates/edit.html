<!-- edit.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Menu Item</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Edit Menu Item</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Name (English)</label>
                <input type="text" name="name_en" class="form-control" value="{{ item.name_en }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Name (Arabic)</label>
                <input type="text" name="name_ar" class="form-control" value="{{ item.name_ar }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description (English)</label>
                <textarea name="description" class="form-control" required>{{ item.description }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Description (Arabic)</label>
                <textarea name="description_ar" class="form-control" required>{{ item.description_ar }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="text" name="price" class="form-control" value="{{ item.price }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-control" required>
                    {% for key, category in categories.items() %}
                    <option value="{{ category.name }}" {% if item.category == category.name %}selected{% endif %}>{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Current Image</label>
                <div>
                    <img src="{{ item.image }}" alt="Menu Image" class="img-fluid" style="max-width: 200px;">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Upload New Image (Optional)</label>
                <input type="file" name="image" class="form-control">
            </div>
            <button type="submit" class="btn btn-success">Update Item</button>
        </form>
    </div>
</body>
</html>
